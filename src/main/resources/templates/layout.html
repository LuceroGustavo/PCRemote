<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="app(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <title>PCRemota - Red de acceso remoto</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" th:href="@{/fonts/inter.css}" href="/fonts/inter.css">
    <link rel="stylesheet" th:href="@{/fonts/jbm.css}" href="/fonts/jbm.css">
    <link rel="stylesheet" th:href="@{/fonts/mso.css}" href="/fonts/mso.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('pc-theme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.dataset.theme = savedTheme || (prefersLight ? 'light' : 'dark');
        })();
    </script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-technical": ["JetBrains Mono"],
                        "body-base": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-technical": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-label-technical { font-family: 'JetBrains Mono', monospace; }
        .bg-server { background: #0f172a; }
        .bg-ws { background: #1e293b; }
        .shadow-led { box-shadow: 0 0 12px 4px rgba(16, 185, 135, 0.55); }
        .btn-cyan { background: #06b6d4; }
        .btn-cyan:hover { background: #0891b2; }
        .badge-status { min-width: 80px; text-align: center; }
        .modal-content { border-radius: 0.25rem; }
        .modal-header, .modal-footer { border-color: #334155; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/tema.css}" href="/css/tema.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="pc-theme icons-pending bg-[#0b1326] text-[#dae2fd] flex h-screen overflow-hidden font-body-base">

<!-- Barra lateral -->
<nav class="pc-sidebar bg-[#0f172a] border-r border-[#334155] flex flex-col h-screen py-gutter w-64 flex-shrink-0 transition-all duration-200 ease-in-out hidden md:flex">
    <div class="px-6 mb-8">
        <h2 class="font-headline-md text-headline-md text-cyan-400">🖥️ PCRemota</h2>
        <p class="font-body-sm text-body-sm text-[#94a3b8]">Centro de Operaciones de Red</p>
    </div>
    <div class="px-4 mb-4" sec:authorize="isAuthenticated()">
        <a href="/equipos/nuevo" th:href="@{/equipos/nuevo}"
           class="w-full bg-cyan-500 text-[#0b1326] flex items-center justify-center gap-2 py-2 rounded-DEFAULT font-label-technical transition-colors hover:bg-cyan-400 shadow-sm">
            <span class="material-symbols-outlined text-[16px]">add</span>Nueva conexión
        </a>
    </div>
    <div class="flex-1 overflow-y-auto px-4 flex flex-col gap-1">
        <a th:href="@{/}" class="text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
            <span class="material-symbols-outlined text-[20px]">dashboard</span>Equipos
        </a>
        <a th:href="@{/escanear}" class="text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
            <span class="material-symbols-outlined text-[20px]">radar</span>Escanear red
        </a>
        <a th:href="@{/credenciales}" class="text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
            <span class="material-symbols-outlined text-[20px]">key</span>Credenciales
        </a>
        <a th:href="@{/auditoria}" class="text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
            <span class="material-symbols-outlined text-[20px]">security</span>Auditoría
        </a>
        <a th:href="@{/cuenta}" class="text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
            <span class="material-symbols-outlined text-[20px]">settings</span>Cuenta
        </a>
    </div>
    <div class="px-4 mt-auto pt-4 border-t border-[#334155] flex flex-col gap-3" sec:authorize="isAuthenticated()">
        <button type="button" id="themeToggle" class="pc-theme-toggle" aria-label="Cambiar a modo claro" aria-pressed="false" title="Alternar modo claro/oscuro"></button>
        <span id="themeLabel" class="font-label-technical text-[10px] text-[#94a3b8] uppercase tracking-[0.18em]">Modo oscuro</span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="w-full text-[#94a3b8] border-l-4 border-transparent flex items-center gap-3 px-3 py-2 rounded-r-DEFAULT font-body-sm text-body-sm hover:bg-[#1e293b] hover:text-[#f1f5f9] transition-colors">
                <span class="material-symbols-outlined text-[20px]">logout</span>Salir
            </button>
        </form>
    </div>
</nav>

<!-- Contenido principal -->
<div class="flex-1 flex flex-col min-w-0">
    <header class="pc-header bg-[#171f33] border-b border-[#334155] flex justify-between items-center px-gutter h-16 w-full flex-shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="font-display-lg text-display-lg text-cyan-400 tracking-tight">🖥️ PCRemota</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden sm:flex items-center gap-2">
                <span id="themeLabelHeader" class="font-label-technical text-[10px] text-[#94a3b8] uppercase tracking-[0.18em]">Oscuro</span>
                <button type="button" id="themeToggleHeader" class="pc-theme-toggle" aria-label="Cambiar a modo claro" aria-pressed="false" title="Alternar modo claro/oscuro"></button>
            </div>
            <a th:href="@{/cuenta}" class="text-[#94a3b8] hover:text-[#f1f5f9] transition-colors cursor-pointer" title="Cambiar contraseña">
                <span class="material-symbols-outlined">settings</span>
            </a>
            <div class="flex items-center gap-2 pl-4 border-l border-[#334155]">
                <span class="material-symbols-outlined text-[#94a3b8]">account_circle</span>
                <span class="font-body-sm text-body-sm text-[#dae2fd]" sec:authentication="name"></span>
            </div>
        </div>
    </header>
    <main class="pc-main flex-1 overflow-y-auto p-margin-mobile md:p-margin-desktop bg-[#0b1326]">
        <th:block th:replace="${content}"/>
    </main>
</div>

<div class="fixed bottom-4 right-4 z-50"><div id="toastContainer"></div></div>
<th:block th:if="${mensaje != null}">
<script th:inline="javascript">
/*<![CDATA[*/
(function(){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'mb-3 p-3 rounded-DEFAULT font-label-technical text-xs text-[#0b1326] bg-cyan-400 shadow-lg';
  t.innerHTML = /*[[${mensaje}]]*/ 'mensaje';
  c.appendChild(t);
  setTimeout(()=>t.remove(), 5000);
})();
/*]]>*/
</script>
</th:block>
<script src="/js/app.js"></script>
</body>
</html>
