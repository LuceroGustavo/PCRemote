<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: { extend: {
                "borderRadius": { "DEFAULT": "0.125rem" },
                "fontFamily": { "label-technical": ["JetBrains Mono"] }
            }}
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-label-technical { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0b1326] text-[#dae2fd] min-h-screen flex items-center justify-center">

<div class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT p-8 shadow-lg w-96">
    <div class="text-center mb-6">
        <h2 class="font-display-lg text-2xl text-cyan-400">🖥️ PCRemota</h2>
        <p class="font-body-sm text-sm text-[#94a3b8]">Network Ops Center</p>
    </div>

    <div th:if="${param.error}" class="mb-3 p-2 bg-[#450a0a] border border-[#f43f5e]/40 text-[#fecaca] rounded font-label-technical text-xs">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.bloqueado}" class="mb-3 p-2 bg-[#422006] border border-[#eab308]/40 text-[#fef08a] rounded font-label-technical text-xs">
        Demasiados intentos fallidos. La IP quedó bloqueada por 15 minutos.
    </div>
    <div th:if="${param.logout}" class="mb-3 p-2 bg-[#064e35] border border-[#10b981]/40 text-[#bbf7d0] rounded font-label-technical text-xs">Sesión cerrada.</div>

    <form method="post" th:action="@{/login}">
        <div class="mb-4">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Usuario</label>
            <input type="text" name="username" required autofocus
                   class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400">
        </div>
        <div class="mb-5">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Contraseña</label>
            <input type="password" name="password" required
                   class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400">
        </div>
        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-[#0b1326] font-label-technical text-xs px-3 py-2 rounded shadow-sm">
            <span class="material-symbols-outlined align-middle mr-1 text-[16px]">lock_open</span> Ingresar
        </button>
    </form>
</div>

</body>
</html>
