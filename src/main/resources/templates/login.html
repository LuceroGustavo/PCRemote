<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.35); }
    </style>
</head>
<body>
<div class="card col-11 col-sm-8 col-md-5 col-lg-3 p-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold">🔐 PCRemota</h2>
        <p class="text-muted mb-0">Panel de acceso a equipos</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-secondary py-2">Sesión cerrada.</div>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
</div>
</body>
</html>
