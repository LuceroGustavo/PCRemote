<!DOCTYPE html>
<html lang="es" th:replace="~{layout :: app(~{::body})}">
<body>

<div class="mb-6">
    <h2 class="font-headline-md text-headline-md text-[#f1f5f9]">Auditoría de accesos</h2>
    <p class="font-body-sm text-body-sm text-[#94a3b8]">Últimos 50 registros</p>
</div>

<div th:if="${#lists.isEmpty(registros)}" class="p-4 bg-[#1e293b] border border-[#334155] rounded-DEFAULT text-[#94a3b8]">Aún no hay registros.</div>

<div th:if="${!#lists.isEmpty(registros)}" class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT overflow-x-auto">
    <table class="w-full text-left font-body-sm text-body-sm">
        <thead>
        <tr class="bg-[#0f172a] border-b border-[#334155] font-label-technical text-label-technical text-[#94a3b8] uppercase">
            <th class="px-4 py-3">Fecha</th>
            <th class="px-4 py-3">Usuario</th>
            <th class="px-4 py-3">Acción</th>
            <th class="px-4 py-3">Equipo</th>
            <th class="px-4 py-3">Detalle</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${registros}" class="border-b border-[#334155] last:border-0 hover:bg-[#2d3a4d]">
            <td class="px-4 py-3 whitespace-nowrap font-label-technical text-label-technical text-[#cbd5e1]" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td class="px-4 py-3 text-[#cbd5e1]" th:text="${r.usuario}"></td>
            <td class="px-4 py-3">
                <span class="font-label-technical text-[10px] px-2 py-0.5 rounded-DEFAULT"
                      th:classappend="${r.accion == 'RDP'} ? 'border border-cyan-500/50 bg-cyan-900/40 text-cyan-300' : (${r.accion == 'COMPARTIDO'} ? 'border border-violet-500/50 bg-violet-900/40 text-violet-300' : (${r.accion == 'VER_PASSWORD'} ? 'border border-amber-500/50 bg-amber-900/40 text-amber-300' : 'border border-[#334155] bg-[#0f172a] text-[#94a3b8]'))"
                      th:text="${r.accion}"></span>
            </td>
            <td class="px-4 py-3 text-[#cbd5e1]" th:text="${r.equipoId != null} ? '#' + ${r.equipoId} : '-'"></td>
            <td class="px-4 py-3 text-[#94a3b8]" th:text="${r.detalle}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
