<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Auditoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="/">🖥️ PCRemota</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
</nav>

<div class="container py-4 col-lg-9">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="m-0"><i class="bi bi-journal-text"></i> Auditoría de accesos</h4>
        <span class="text-muted small">Últimos 50 registros</span>
    </div>

    <div th:if="${#lists.isEmpty(registros)}" class="alert alert-info py-2">Aún no hay registros.</div>

    <div class="card p-0" th:if="${!#lists.isEmpty(registros)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acción</th>
                <th>Equipo</th>
                <th>Detalle</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${registros}">
                <td class="text-nowrap small" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${r.usuario}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${r.accion == 'RDP'} ? 'bg-primary' : (${r.accion == 'COMPARTIDO'} ? 'bg-info text-dark' : (${r.accion == 'VER_PASSWORD'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                          th:text="${r.accion}"></span>
                </td>
                <td th:text="${r.equipoId != null} ? '#' + ${r.equipoId} : '-'"></td>
                <td class="small text-muted" th:text="${r.detalle}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
