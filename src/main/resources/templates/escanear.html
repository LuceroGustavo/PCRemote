<!DOCTYPE html>
<html lang="es" th:replace="~{layout :: app(~{::body})}">
<body>

<div class="max-w-3xl">
    <div class="flex justify-between items-center mb-6">
        <h2 class="font-headline-md text-headline-md text-[#f1f5f9]">Escanear red</h2>
        <a href="/" class="font-label-technical text-xs text-[#94a3b8] hover:text-cyan-300">← Volver</a>
    </div>

    <form method="post" th:action="@{/escanear}" class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT p-card-padding mb-4">
        <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Rango de IPs</label>
        <div class="flex flex-col md:flex-row gap-3">
            <input type="text" name="rango" th:value="${rango}"
                   class="flex-1 bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   placeholder="192.168.1.1-254">
            <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-[#0b1326] font-label-technical text-xs px-4 py-2 rounded shadow-sm flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[16px]">search</span> Buscar equipos
            </button>
        </div>
        <p class="font-body-sm text-body-sm text-[#94a3b8] mt-2">
            Formato: <code class="text-cyan-300">192.168.1.1-254</code> o
            <code class="text-cyan-300">192.168.1.10-192.168.1.200</code>
        </p>
        <div th:if="${error}" class="mt-3 p-2 bg-[#450a0a] border border-[#f43f5e]/40 text-[#fecaca] rounded font-label-technical text-xs" th:text="${error}"></div>
    </form>

    <div th:if="${encontrados}" class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT p-card-padding">
        <form method="post" th:action="@{/escanear/importar}">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-headline-md text-body-base text-[#f1f5f9]">Equipos encontrados:
                    <span class="text-emerald-400" th:text="${total}">0</span>
                </h3>
            </div>
            <p class="font-body-sm text-body-sm text-[#94a3b8] mb-4">
                Seleccioná los que querés agregar a la grilla (sin credenciales; se cargan después).
            </p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <label class="flex items-center gap-2 border border-[#334155] rounded px-3 py-2 hover:bg-[#2d3a4d] cursor-pointer"
                       th:each="ip : ${encontrados}">
                    <input type="checkbox" name="ips" th:value="${ip}" th:id="'ip-' + ${ip}" class="accent-cyan-500">
                    <span class="font-label-technical text-label-technical text-[#cbd5e1]" th:text="${ip}"></span>
                </label>
            </div>
            <div class="mt-4">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-[#0b1326] font-label-technical text-xs px-4 py-2 rounded shadow-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-[16px]">add</span> Importar seleccionados
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
