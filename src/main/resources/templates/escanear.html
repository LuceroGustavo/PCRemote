<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Escanear red</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="/">🖥️ PCRemota</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
</nav>

<div class="container py-4 col-lg-8">
    <h4 class="mb-3"><i class="bi bi-radar"></i> Escanear red</h4>

    <form method="post" th:action="@{/escanear}" class="card p-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-8">
                <label class="form-label">Rango de IPs</label>
                <input type="text" name="rango" class="form-control" th:value="${rango}"
                       placeholder="192.168.1.1-254">
                <div class="form-text">Formato: <code>192.168.1.1-254</code> o <code>192.168.1.10-192.168.1.200</code></div>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search"></i> Buscar equipos
                </button>
            </div>
        </div>
        <div th:if="${error}" class="alert alert-danger mt-3 py-2" th:text="${error}"></div>
    </form>

    <div th:if="${encontrados}">
        <form method="post" th:action="@{/escanear/importar}">
            <div class="card p-4">
                <h5 class="mb-3">
                    Equipos encontrados: <span class="badge bg-success" th:text="${total}">0</span>
                </h5>
                <p class="text-muted small">Seleccioná los que querés agregar a la grilla (sin credenciales; se cargan después).</p>
                <div class="row row-cols-2 row-cols-md-4 g-2">
                    <div class="col" th:each="ip : ${encontrados}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="ips" th:value="${ip}" th:id="'ip-' + ${ip}">
                            <label class="form-check-label" th:for="'ip-' + ${ip}" th:text="${ip}"></label>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus-lg"></i> Importar seleccionados
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
