<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="/">🖥️ PCRemota</a>
    <div class="ms-auto d-flex align-items-center gap-3">
        <a href="/cuenta" class="text-white-50 small text-decoration-none" title="Cambiar contraseña">
            <i class="bi bi-shield-lock"></i> <b th:text="${usuario}"></b>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="m-0">Equipos de la red</h4>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="btnRefrescar">
                <i class="bi bi-arrow-repeat"></i> Refrescar estado
            </button>
            <a href="/escanear" class="btn btn-info text-dark"><i class="bi bi-radar"></i> Escanear red</a>
            <a href="/credenciales" class="btn btn-outline-dark"><i class="bi bi-key-fill"></i> Credenciales</a>
            <a href="/auditoria" class="btn btn-outline-primary"><i class="bi bi-journal-text"></i> Auditoría</a>
            <a href="/equipos/nuevo" class="btn btn-success">+ Nuevo equipo</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success py-2" th:text="${mensaje}"></div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" th:each="equipo : ${equipos}">
            <div class="card h-100 equipo-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h5 class="card-title mb-0" th:text="${equipo.nombre}">Equipo</h5>
                            <small class="text-muted" th:text="${equipo.ip} + ':' + ${equipo.puertoRdp}">IP</small>
                        </div>
                        <span class="badge estado-badge" th:id="'estado-' + ${equipo.id}"
                              th:classappend="${equipo.online} ? 'bg-success' : 'bg-danger'"
                              th:text="${equipo.online} ? 'EN LÍNEA' : 'OFFLINE'">estado</span>
                    </div>

                    <hr class="my-2">

                    <div class="small text-muted">
                        <div th:if="${equipo.usuario}"><i class="bi bi-person"></i> <b>Usuario:</b> <span th:text="${equipo.usuario}"></span></div>
                        <div th:if="${equipo.so}"><i class="bi bi-cpu"></i> <b>SO:</b> <span th:text="${equipo.so}"></span></div>
                        <div th:if="${equipo.ubicacion}"><i class="bi bi-geo-alt"></i> <span th:text="${equipo.ubicacion}"></span></div>
                        <div th:if="${equipo.notas}" class="text-truncate" th:title="${equipo.notas}"><i class="bi bi-sticky"></i> <span th:text="${equipo.notas}"></span></div>
                        <div th:if="${equipo.ultimoAcceso}"><i class="bi bi-clock-history"></i> Último acceso: <span th:text="${#temporals.format(equipo.ultimoAcceso, 'dd/MM/yyyy HH:mm')}"></span></div>
                    </div>

                    <div class="d-flex flex-wrap gap-1 mt-3">
                        <button class="btn btn-sm btn-primary accion" th:data-accion="@{/api/equipos/{id}/conectar(id=${equipo.id})}">
                            <i class="bi bi-display"></i> Conectar
                        </button>
                        <button class="btn btn-sm btn-info text-dark accion" th:data-accion="@{/api/equipos/{id}/compartido(id=${equipo.id})}">
                            <i class="bi bi-folder2-open"></i> Archivos
                        </button>
                        <button class="btn btn-sm btn-outline-secondary ver-pass" th:data-url="@{/api/equipos/{id}/password(id=${equipo.id})}"
                                th:data-nombre="${equipo.nombre}">
                            <i class="bi bi-key"></i> Ver pass
                        </button>
                        <a class="btn btn-sm btn-outline-warning" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}" method="post" class="m-0"
                              onsubmit="return confirm('¿Eliminar ' + '${equipo.nombre}' + '?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(equipos)}" class="text-center text-muted py-5">
        <p class="mb-1">No hay equipos cargados.</p>
        <a href="/equipos/nuevo" class="btn btn-sm btn-success">Agregar el primero</a>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
