<!DOCTYPE html>
<html lang="es" th:replace="~{layout :: app(~{::body})}">
<body>

<div class="max-w-md">
    <div class="flex justify-between items-center mb-6">
        <h2 class="font-headline-md text-headline-md text-[#f1f5f9]">Cambiar contraseña</h2>
        <a href="/" class="font-label-technical text-xs text-[#94a3b8] hover:text-cyan-300">← Volver</a>
    </div>

    <div th:if="${error}" class="mb-3 p-2 bg-[#450a0a] border border-[#f43f5e]/40 text-[#fecaca] rounded font-label-technical text-xs" th:text="${error}"></div>

    <form method="post" th:action="@{/cuenta/cambiar}" class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT p-card-padding">
        <div class="mb-4">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Contraseña actual</label>
            <input type="password" name="actual" required
                   class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400">
        </div>
        <div class="mb-4">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Nueva contraseña</label>
            <input type="password" name="nueva" required minlength="6"
                   class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400">
        </div>
        <div class="mb-5">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Confirmar nueva contraseña</label>
            <input type="password" name="confirmacion" required
                   class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400">
        </div>
        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-[#0b1326] font-label-technical text-xs px-4 py-2 rounded shadow-sm flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[16px]">key</span> Cambiar contraseña
        </button>
    </form>
</div>

</body>
</html>
