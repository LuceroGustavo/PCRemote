<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Cambiar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="/">🖥️ PCRemota</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
</nav>

<div class="container py-4 col-lg-5">
    <h4 class="mb-4"><i class="bi bi-shield-lock"></i> Cambiar contraseña</h4>

    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <form method="post" th:action="@{/cuenta/cambiar}" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Contraseña actual</label>
            <input type="password" name="actual" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" name="nueva" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmar nueva contraseña</label>
            <input type="password" name="confirmacion" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
    </form>
</div>
</body>
</html>
