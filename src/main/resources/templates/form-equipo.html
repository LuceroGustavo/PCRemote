<!DOCTYPE html>
<html lang="es" th:replace="~{layout :: app(~{::body})}">
<body>

<div class="flex justify-between items-center mb-6">
    <h2 class="font-headline-md text-headline-md text-[#f1f5f9]"
        th:text="${equipo.id == null} ? 'Nuevo equipo' : 'Editar equipo'"></h2>
    <a href="/" class="font-label-technical text-xs text-[#94a3b8] hover:text-cyan-300">← Volver</a>
</div>

<div th:if="${error}" th:text="${error}"
     class="mb-3 p-2 bg-[#450a0a] border border-[#f43f5e]/40 text-[#fecaca] rounded font-label-technical text-xs"></div>

<form th:object="${equipo}"
      th:action="${equipo.id == null} ? @{/equipos/guardar} : @{/equipos/{id}/actualizar(id=${equipo.id})}"
      method="post" class="bg-[#1e293b] border border-[#334155] rounded-DEFAULT p-card-padding">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Nombre *</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{nombre}" required>
            <div class="text-[#fca5a5] font-label-technical text-[10px]" th:errors="*{nombre}"></div>
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">IP *</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{ip}" required placeholder="192.168.1.10">
            <div class="text-[#fca5a5] font-label-technical text-[10px]" th:errors="*{ip}"></div>
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Puerto RDP</label>
            <input type="number" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{puertoRdp}">
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Sistema operativo</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{so}" placeholder="Windows 11 Pro / Ubuntu 22.04">
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Usuario</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{usuario}" placeholder="Administrator">
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Contraseña <span class="text-[#94a3b8]" th:text="${equipo.id != null} ? '(vacío para no cambiar)' : ''"></span></label>
            <input type="password" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   name="password" id="password">
            <div class="mt-1.5 flex items-center gap-2">
                <input class="accent-cyan-500" type="checkbox" id="verPassCheckbox">
                <label class="font-label-technical text-xs text-[#94a3b8]" for="verPassCheckbox">Mostrar contraseña</label>
            </div>
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Ubicación</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{ubicacion}" placeholder="Sala / Rack A4">
        </div>
        <div>
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Recurso compartido</label>
            <input type="text" class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400"
                   th:field="*{recursoCompartido}" placeholder="c$ (disco C)">
        </div>
        <div class="md:col-span-2">
            <label class="block font-label-technical text-xs text-[#94a3b8] mb-1">Notas</label>
            <textarea class="w-full bg-[#0b1326] border border-[#334155] rounded text-[#f1f5f9] px-3 py-2 focus:outline-none focus:border-cyan-400" rows="2"
                      th:field="*{notas}"></textarea>
        </div>
    </div>

    <div class="flex gap-3 mt-5">
        <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-[#0b1326] font-label-technical text-xs px-4 py-2 rounded shadow-sm">Guardar</button>
        <a href="/" class="border border-[#334155] bg-[#0b1326]/60 text-[#cfd8dc] font-label-technical text-xs px-4 py-2 rounded hover:bg-[#2d3a4d]">Cancelar</a>
    </div>
</form>

<script>
    document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'verPassCheckbox') {
            document.getElementById('password').type = e.target.checked ? 'text' : 'password';
        }
    });
</script>

</body>
</html>
