<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCRemota - Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand fw-bold" href="/">🖥️ PCRemota</a>
    <div class="ms-auto">
        <a href="/" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
</nav>

<div class="container py-4 col-lg-7">
    <h4 class="mb-4" th:text="${equipo.id == null} ? 'Nuevo equipo' : 'Editar equipo'"></h4>

    <form th:action="${equipo.id == null} ? @{/equipos/guardar} : @{/equipos/{id}/actualizar(id=${equipo.id})}"
          method="post" class="card p-4">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre *</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
                <div class="text-danger small" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">IP *</label>
                <input type="text" class="form-control" th:field="*{ip}" required placeholder="192.168.1.10">
                <div class="text-danger small" th:errors="*{ip}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Puerto RDP</label>
                <input type="number" class="form-control" th:field="*{puertoRdp}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Sistema operativo</label>
                <input type="text" class="form-control" th:field="*{so}" placeholder="Windows 11 Pro">
            </div>
            <div class="col-md-6">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" th:field="*{usuario}" placeholder="Administrator">
            </div>
            <div class="col-md-6">
                <label class="form-label">Contraseña <span class="text-muted small" th:text="${equipo.id != null} ? '(dejar vacío para no cambiar)' : ''"></span></label>
                <input type="password" class="form-control" name="password" id="password">
                <div class="form-check mt-1">
                    <input class="form-check-input" type="checkbox" id="verPass">
                    <label class="form-check-label small" for="verPass">Mostrar</label>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Ubicación</label>
                <input type="text" class="form-control" th:field="*{ubicacion}" placeholder="Oficina / Sala">
            </div>
            <div class="col-md-6">
                <label class="form-label">Recurso compartido</label>
                <input type="text" class="form-control" th:field="*{recursoCompartido}" placeholder="c$ (disco C)">
            </div>
            <div class="col-12">
                <label class="form-label">Notas</label>
                <textarea class="form-control" rows="2" th:field="*{notas}"></textarea>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('verPass').addEventListener('change', function () {
        document.getElementById('password').type = this.checked ? 'text' : 'password';
    });
</script>
</body>
</html>
